<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG Animated Icon - Ocean Waves</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; font-family: Arial, sans-serif; background: #fff; }
  p { color: #555; font-size: 14px; }
</style>
</head>
<body>

<!-- Animated ocean waves with moving clouds, 300 x 300 -->
<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame"><rect width="300" height="300" rx="36"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e3f6ff"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect width="300" height="300" fill="url(#sky)"/>

    <!-- moving clouds (three different sizes and speeds) -->
    <g fill="#ffffff" opacity="0.95">
      <g transform="translate(0 40) scale(1.1)">
        <circle cx="20" cy="22" r="14"/>
        <circle cx="42" cy="14" r="19"/>
        <circle cx="66" cy="22" r="14"/>
        <rect x="20" y="22" width="46" height="14" rx="2"/>
      </g>
      <animateTransform attributeName="transform" type="translate" from="-170 0" to="340 0" dur="14s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g fill="#ffffff" opacity="0.95">
      <g transform="translate(0 85) scale(0.8)">
        <circle cx="20" cy="22" r="14"/>
        <circle cx="42" cy="14" r="19"/>
        <circle cx="66" cy="22" r="14"/>
        <rect x="20" y="22" width="46" height="14" rx="2"/>
      </g>
      <animateTransform attributeName="transform" type="translate" from="-170 0" to="340 0" dur="20s" begin="-8s" repeatCount="indefinite"/>
    </g>
    <g fill="#ffffff" opacity="0.95">
      <g transform="translate(0 20) scale(0.6)">
        <circle cx="20" cy="22" r="14"/>
        <circle cx="42" cy="14" r="19"/>
        <circle cx="66" cy="22" r="14"/>
        <rect x="20" y="22" width="46" height="14" rx="2"/>
      </g>
      <animateTransform attributeName="transform" type="translate" from="-170 0" to="340 0" dur="26s" begin="-16s" repeatCount="indefinite"/>
    </g>

    <!-- ocean waves (three layers moving at different speeds) -->
    <path d="M0 185 q37.5 -18 75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 L750 300 L0 300 Z" fill="#6ec6e8">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-150 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0 210 q37.5 -22 75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 L750 300 L0 300 Z" fill="#2e9bd6">
      <animateTransform attributeName="transform" type="translate" from="-150 0" to="0 0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0 240 q37.5 -26 75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 L750 300 L0 300 Z" fill="#1565a8">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-150 0" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>

<p>SVG animated icon: ocean waves with moving clouds</p>

</body>
</html>
