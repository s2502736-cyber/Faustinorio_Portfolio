<!DOCTYPE html>

<title>SVG Text Art - Love Looks Not With the Eyes</title>
<style>

<body>
<!-- Quotation: "Love looks not with the eyes, but with the mind" - William Shakespeare, A Midsummer Night's Dream -->
<svg width="900" height="780" viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="ring0" d="M450.0,694.6 C156.0,479.0 107.0,253.6 263.8,165.4 C361.8,111.5 430.4,155.6 450.0,224.2 C469.6,155.6 538.2,111.5 636.2,165.4 C793.0,253.6 744.0,479.0 450.0,694.6 Z"/>

    <path id="ring2" d="M450.0,624.4 C234.0,466.0 198.0,300.4 313.2,235.6 C385.2,196.0 435.6,228.4 450.0,278.8 C464.4,228.4 514.8,196.0 586.8,235.6 C702.0,300.4 666.0,466.0 450.0,624.4 Z"/>
  </defs>
  <!-- The quotation written along three heart-shaped paths -->
  <text font-size="26" fill="#e8506a" font-family="Georgia, serif" font-style="italic"><textPath href="#ring0">Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • </textPath></text>
  <text font-size="23" fill="#14a3a0" font-family="Georgia, serif" font-style="italic"><textPath href="#ring1">Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • </textPath></text>
  <text font-size="20" fill="#7b3fc4" font-family="Georgia, serif" font-style="italic"><textPath href="#ring2">Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • Love looks not with the eyes, but with the mind • </textPath></text>

  <!-- Words inside the heart -->
  <text x="450" y="395" font-size="104" font-weight="bold" font-family="Georgia, serif" fill="#e8506a" text-anchor="middle">Love</text>
  <text x="450" y="440" font-size="26" font-family="Georgia, serif" fill="#14a3a0" text-anchor="middle">looks not with the eyes,</text>
  <text x="450" y="482" font-size="34" font-style="italic" font-family="Georgia, serif" fill="#7b3fc4" text-anchor="middle">but with the mind</text>
  <text x="450" y="520" font-size="16" font-family="Georgia, serif" fill="#555" text-anchor="middle">William Shakespeare</text>
